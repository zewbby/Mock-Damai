name: mock-damai-migration
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${SMART_TICKET_DB_PASSWORD:?Run start.ps1 first}
      MYSQL_DATABASE: mock_damai
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../../docs/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../docs/sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -uroot -D mock_damai -e 'SELECT COUNT(*) FROM ticket_stock' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
  redis:
    image: redis:7.2-alpine
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  namesrv:
    image: apache/rocketmq:5.3.2
    command: ["sh", "mqnamesrv"]
    environment:
      JAVA_OPT_EXT: -Xms256m -Xmx256m -Xmn128m
    ports:
      - "127.0.0.1:19876:9876"
  broker:
    image: apache/rocketmq:5.3.2
    command: ["sh", "mqbroker", "-c", "/home/rocketmq/broker.conf"]
    environment:
      NAMESRV_ADDR: namesrv:9876
      JAVA_OPT_EXT: -Xms512m -Xmx512m -Xmn256m
    depends_on:
      - namesrv
    ports:
      - "127.0.0.1:20909:20909"
      - "127.0.0.1:20911:20911"
      - "127.0.0.1:20912:20912"
    volumes:
      - ./broker.conf:/home/rocketmq/broker.conf:ro
      - broker-store:/home/rocketmq/store
      - broker-logs:/home/rocketmq/logs
volumes:
  mysql-data:
  redis-data:
  broker-store:
  broker-logs:
