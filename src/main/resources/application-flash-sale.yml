# flash-sale profile：只保存高并发场景相对 application.yml 的参数覆盖。
# 启动时 AsyncOrderSubmitGuardrail 会强制校验 RocketMQ 事务消息、入口预落库和 in-flight 等关键约束。
spring:
  datasource:
    hikari:
      minimum-idle: ${SMART_TICKET_FLASH_SALE_DB_MIN_IDLE:30}
      maximum-pool-size: ${SMART_TICKET_FLASH_SALE_DB_MAX_POOL_SIZE:80}
      connection-timeout: ${SMART_TICKET_FLASH_SALE_DB_CONNECTION_TIMEOUT:2000}
smart-ticket:
  async-order-submit:
    persist-request-before-publish: ${SMART_TICKET_ASYNC_ORDER_PERSIST_REQUEST_BEFORE_PUBLISH:false}
    publisher-mode: ${SMART_TICKET_ASYNC_ORDER_PUBLISHER_MODE:rocketmq}
    rocket-mq-transaction-message-enabled: ${SMART_TICKET_ASYNC_ORDER_ROCKETMQ_TRANSACTION_MESSAGE_ENABLED:true}
    in-flight-control-enabled: ${SMART_TICKET_ASYNC_ORDER_IN_FLIGHT_CONTROL_ENABLED:true}
    max-in-flight-per-ticket-category: ${SMART_TICKET_ASYNC_ORDER_MAX_IN_FLIGHT_PER_TICKET_CATEGORY:100000}
    in-flight-counter-ttl-seconds: ${SMART_TICKET_ASYNC_ORDER_IN_FLIGHT_COUNTER_TTL_SECONDS:900}
    redis-stream-read-batch-size: ${SMART_TICKET_ASYNC_ORDER_REDIS_STREAM_READ_BATCH_SIZE:256}
    redis-stream-poll-fixed-delay-millis: ${SMART_TICKET_ASYNC_ORDER_REDIS_STREAM_POLL_FIXED_DELAY_MILLIS:20}
    redis-stream-block-millis: ${SMART_TICKET_ASYNC_ORDER_REDIS_STREAM_BLOCK_MILLIS:50}
    redis-stream-worker-threads: ${SMART_TICKET_ASYNC_ORDER_REDIS_STREAM_WORKER_THREADS:32}

  mq-consumer:
    concurrent-consumers: ${SMART_TICKET_MQ_CONSUMER_CONCURRENT_CONSUMERS:48}
    max-concurrent-consumers: ${SMART_TICKET_MQ_CONSUMER_MAX_CONCURRENT_CONSUMERS:160}
    prefetch-count: ${SMART_TICKET_MQ_CONSUMER_PREFETCH_COUNT:32}
    async-queue-shard-count: ${SMART_TICKET_MQ_CONSUMER_ASYNC_QUEUE_SHARD_COUNT:64}
    max-concurrent-consumer-cap: ${SMART_TICKET_MQ_CONSUMER_MAX_CONCURRENT_CONSUMER_CAP:256}
    max-prefetch-count: ${SMART_TICKET_MQ_CONSUMER_MAX_PREFETCH_COUNT:100}
    max-unacked-messages: ${SMART_TICKET_MQ_CONSUMER_MAX_UNACKED_MESSAGES:8192}
    max-async-queue-shard-count: ${SMART_TICKET_MQ_CONSUMER_MAX_ASYNC_QUEUE_SHARD_COUNT:256}
    rocket-mq-consume-thread-number: ${SMART_TICKET_ROCKETMQ_CONSUME_THREAD_NUMBER:48}
    rocket-mq-consume-thread-max: ${SMART_TICKET_ROCKETMQ_CONSUME_THREAD_MAX:160}
    rocket-mq-pull-batch-size: ${SMART_TICKET_ROCKETMQ_PULL_BATCH_SIZE:128}
    rocket-mq-consume-message-batch-max-size: ${SMART_TICKET_ROCKETMQ_CONSUME_MESSAGE_BATCH_MAX_SIZE:32}
    rocket-mq-pull-threshold-for-queue: ${SMART_TICKET_ROCKETMQ_PULL_THRESHOLD_FOR_QUEUE:4096}
    async-order-batch-enabled: ${SMART_TICKET_ASYNC_ORDER_BATCH_ENABLED:true}
    async-order-batch-worker-count: ${SMART_TICKET_ASYNC_ORDER_BATCH_WORKER_COUNT:16}
    max-async-order-batch-worker-count: ${SMART_TICKET_ASYNC_ORDER_BATCH_MAX_WORKER_COUNT:64}
    async-order-batch-size: ${SMART_TICKET_ASYNC_ORDER_BATCH_SIZE:64}
    async-order-batch-max-wait-millis: ${SMART_TICKET_ASYNC_ORDER_BATCH_MAX_WAIT_MILLIS:20}
    async-order-batch-queue-capacity: ${SMART_TICKET_ASYNC_ORDER_BATCH_QUEUE_CAPACITY:32768}
    async-order-batch-offer-timeout-millis: ${SMART_TICKET_ASYNC_ORDER_BATCH_OFFER_TIMEOUT_MILLIS:50}

  order-timeout:
    delay-message-enabled: ${SMART_TICKET_ORDER_TIMEOUT_DELAY_MESSAGE_ENABLED:true}
    publisher-mode: ${SMART_TICKET_ORDER_TIMEOUT_PUBLISHER_MODE:rocketmq}
    scan-batch-size: ${SMART_TICKET_ORDER_TIMEOUT_SCAN_BATCH_SIZE:5000}
    scan-fixed-delay-millis: ${SMART_TICKET_ORDER_TIMEOUT_SCAN_FIXED_DELAY_MILLIS:500}

  stock-bucket:
    default-bucket-count: ${SMART_TICKET_STOCK_BUCKET_DEFAULT_COUNT:128}
    active-probe-count: ${SMART_TICKET_STOCK_BUCKET_ACTIVE_PROBE_COUNT:12}
    tail-bucket-count: ${SMART_TICKET_STOCK_BUCKET_TAIL_BUCKET_COUNT:32}

  waiting-room:
    enabled: ${SMART_TICKET_WAITING_ROOM_ENABLED:true}
    default-admission-token-batch-size: ${SMART_TICKET_WAITING_ROOM_DEFAULT_ADMISSION_TOKEN_BATCH_SIZE:200}
    max-admission-token-batch-size: ${SMART_TICKET_WAITING_ROOM_MAX_ADMISSION_TOKEN_BATCH_SIZE:2000}

  activity-isolation:
    enabled: ${SMART_TICKET_ACTIVITY_ISOLATION_ENABLED:true}
    max-in-flight-per-activity-ticket-category: ${SMART_TICKET_ACTIVITY_ISOLATION_MAX_IN_FLIGHT_PER_ACTIVITY_TICKET_CATEGORY:200000}

  risk-control:
    enabled: ${SMART_TICKET_RISK_CONTROL_ENABLED:true}
    max-ip-attempts-per-minute: ${SMART_TICKET_RISK_CONTROL_MAX_IP_ATTEMPTS_PER_MINUTE:3000}
    max-user-attempts-per-minute: ${SMART_TICKET_RISK_CONTROL_MAX_USER_ATTEMPTS_PER_MINUTE:20}
    counter-ttl-seconds: ${SMART_TICKET_RISK_CONTROL_COUNTER_TTL_SECONDS:180}
    gateway-decision-required: ${SMART_TICKET_RISK_CONTROL_GATEWAY_DECISION_REQUIRED:false}
    skip-local-counter-when-gateway-pass: ${SMART_TICKET_RISK_CONTROL_SKIP_LOCAL_COUNTER_WHEN_GATEWAY_PASS:true}

  show-relation-cache:
    refresh-fixed-delay-millis: ${SMART_TICKET_SHOW_RELATION_CACHE_REFRESH_FIXED_DELAY_MILLIS:10000}
    lookup-cache-maximum-size: ${SMART_TICKET_SHOW_RELATION_CACHE_LOOKUP_MAXIMUM_SIZE:1000000}

  order-snapshot-cache:
    refresh-fixed-delay-millis: ${SMART_TICKET_ORDER_SNAPSHOT_CACHE_REFRESH_FIXED_DELAY_MILLIS:10000}

  user-status-cache:
    expire-after-write-seconds: ${SMART_TICKET_USER_STATUS_CACHE_EXPIRE_AFTER_WRITE_SECONDS:60}
    maximum-size: ${SMART_TICKET_USER_STATUS_CACHE_MAXIMUM_SIZE:1000000}

  rate-limit:
    order-user-capacity: ${SMART_TICKET_RATE_LIMIT_ORDER_USER_CAPACITY:3}
    order-user-refill-rate-per-second: ${SMART_TICKET_RATE_LIMIT_ORDER_USER_REFILL_RATE_PER_SECOND:0.5}
    order-ip-capacity: ${SMART_TICKET_RATE_LIMIT_ORDER_IP_CAPACITY:500}
    order-ip-refill-rate-per-second: ${SMART_TICKET_RATE_LIMIT_ORDER_IP_REFILL_RATE_PER_SECOND:120}
    order-api-capacity: ${SMART_TICKET_RATE_LIMIT_ORDER_API_CAPACITY:40000}
    order-api-refill-rate-per-second: ${SMART_TICKET_RATE_LIMIT_ORDER_API_REFILL_RATE_PER_SECOND:12000}
    order-ticket-capacity: ${SMART_TICKET_RATE_LIMIT_ORDER_TICKET_CAPACITY:24000}
    order-ticket-refill-rate-per-second: ${SMART_TICKET_RATE_LIMIT_ORDER_TICKET_REFILL_RATE_PER_SECOND:6000}
    key-ttl-seconds: ${SMART_TICKET_RATE_LIMIT_KEY_TTL_SECONDS:300}
