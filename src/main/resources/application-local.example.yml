# 本文件只提供本机基础设施连接示例。
# 复制为 application-local.yml 后填写本机环境；该目标文件已被 .gitignore 忽略。
# 交易链路、MQ 模式、库存分桶、限流等业务配置统一由 application.yml / application-flash-sale.yml 管理。

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SMART_TICKET_DB_URL:jdbc:mysql://localhost:3306/mock_damai?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8}
    username: ${SMART_TICKET_DB_USERNAME:root}
    password: ${SMART_TICKET_DB_PASSWORD:}
    hikari:
      pool-name: MockDamaiHikariCP
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      host: ${SMART_TICKET_REDIS_HOST:localhost}
      port: ${SMART_TICKET_REDIS_PORT:6379}
      database: ${SMART_TICKET_REDIS_DATABASE:0}
      password: ${SMART_TICKET_REDIS_PASSWORD:}

logging:
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
    org.apache.rocketmq: WARN
    org.apache.ibatis: WARN
    com.zaxxer.hikari: INFO
    com.zewbby.smartticket: INFO
